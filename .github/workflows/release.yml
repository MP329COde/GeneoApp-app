name: Release

# Déclenché uniquement par un tag sémantique (ex. v0.2.0), pour publier une
# release GitHub avec les artefacts multi-OS construits par electron-builder
# (ADR 0005). Aucun secret n'est requis : les paquets ne sont pas signés
# (pas de certificat de signature de code stocké dans ce dépôt).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build paquet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation reproductible (lockfile figé)
        run: npm ci

      - name: Tests avant packaging
        run: npm test

      - name: Build du client
        run: npm run build

      - name: Packaging electron-builder (${{ matrix.target }})
        run: npm run package:${{ matrix.target }}
        env:
          # Pas de token de publication automatique : la release GitHub est
          # créée explicitement ci-dessous à partir des artefacts, sans
          # laisser electron-builder publier lui-même (pas de secret requis).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Sommes de contrôle SHA-256 des artefacts
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec shasum -a 256 {} \; > "checksums-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: geneoapp-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/checksums-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publier la release GitHub
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Sommes de contrôle globales
        working-directory: artifacts
        run: cat checksums-*.sha256 > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        env:
          # Jeton éphémère fourni automatiquement par GitHub Actions pour la
          # durée du job : ce n'est pas un secret stocké dans le dépôt.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
