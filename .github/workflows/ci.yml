name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Permissions minimales par défaut (principe du moindre privilège) : ce
# workflow ne fait que lire le dépôt, il n'écrit rien et ne manipule aucun
# secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, tests, build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation reproductible (lockfile figé)
        run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: Tests E2E navigateur (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation reproductible (lockfile figé)
        run: npm ci

      - name: Installation du navigateur Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  site:
    name: Build du site de présentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - working-directory: site
        run: npm ci

      - working-directory: site
        run: npm run build

  multi-os:
    name: Tests et build (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation reproductible (lockfile figé)
        run: npm ci

      - run: npm test
      - run: npm run build
